schema: spec-driven
context: |
  Первый проектный источник — openspec/context/00-start-here.md; обязательные правила и документы выбираются по его маршруту.
  Требования находятся в openspec/specs и нормативных приложениях; тематический контекст, ADR и примеры связывают их с решениями и проверками.

rules:
  proposal:
    - Заполняй Why, What Changes, Capabilities, Impact, Scope и Non-goals; границу реализованного и планируемого бери из CTX-002.
  specs:
    - Используй формат схемы spec-driven: нормативные требования и отдельные сценарии с наблюдаемым результатом; сохраняй действующие предметные ограничения проекта.
  design:
    - Описывай причины решения и границы компонентов по context/03-architecture.md и соответствующим ADR.
  tasks:
    - Связывай задачи с предметными требованиями и предусмотренными проектом проверками; в плане улучшения кадров сохраняй выбор условий обработки до реализации.
