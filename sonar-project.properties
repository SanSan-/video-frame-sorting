# Метаданные проекта
sonar.projectKey=ocr-video-frame-sorting
sonar.projectName=ocr-video-frame-sorting
sonar.projectVersion=1.0.1
sonar.sourceEncoding=UTF-8

# Адрес и токен передаются только через SONAR_HOST_URL и SONAR_TOKEN.

# Исходники и тесты
sonar.sources=frame_sorter
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.exclusions=.venv/**,.scannerwork/**,output/**,tmp/**,**/__pycache__/**

# Python
sonar.python.version=3.14

# Отчёт создаётся pytest-cov перед каждым scanner-циклом.
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=frame_sorter/web/static/**
